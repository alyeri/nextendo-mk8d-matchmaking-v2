services:
  server:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "443:443/tcp"
      - "60003:60003/tcp"
      - "127.0.0.1:18082:8082/tcp"
    volumes:
      - ./secrets:/run/nextendo:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
