services:
  server:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DASH_BIND: 0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "443:443/tcp"
      - "60003:60003/tcp"
      - "10025:10025/udp"
      - "10125:10125/udp"
      - "33334:33334/udp"
      - "50920:50920/udp"
      - "127.0.0.1:18082:8082/tcp"
    volumes:
      - server-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  server-data:
  redis-data:
