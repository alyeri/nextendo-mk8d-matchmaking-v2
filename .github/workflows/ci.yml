name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [nextendo-nex, server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            nextendo-nex/go.sum
            server/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [nextendo-nex, server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test -race -count=1 ./...

  build:
    name: Reproducible Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            nextendo-nex/go.sum
            server/go.sum
      - name: Build static server
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/mk8d-server .
      - uses: actions/upload-artifact@v4
        with:
          name: mk8d-server-linux-amd64
          path: dist/mk8d-server
          if-no-files-found: error

  container:
    name: Compose validation and container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: docker build --tag nextendo-mk8d-matchmaking-v2:test .
